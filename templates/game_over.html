{% extends "base.html" %}
{% block title %}نهاية اللعبة{% endblock %}

{% block content %}
<div class="result-page">
    <span class="result-icon">💔</span>
    <h2>انتهت اللعبة</h2>
    <p class="result-subtitle">نفدت قلوبك — لكن العلم لا ينتهي</p>
    <div class="score-display">
        <span class="score-big">{{ score }}</span>
        <span class="score-label">نقطة</span>
    </div>
    <div class="result-actions">
        <a href="{{ url_for('levels') }}" class="btn btn-primary btn-large">حاول مجدداً</a>
        <a href="{{ url_for('index') }}" class="btn btn-outline btn-large">الرئيسية</a>
    </div>
</div>
{% endblock %}
